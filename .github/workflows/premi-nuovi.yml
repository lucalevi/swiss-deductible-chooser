# Insurek — l'aggiornamento annuale dei premi.
#
# L'UFSP approva e pubblica i premi dell'anno dopo verso il 22-23 settembre.
# Questo lavoro gira ogni giorno in settembre e ottobre: scarica i file,
# ricostruisce i JSON, li verifica contro il CSV federale e, SE qualcosa e'
# cambiato, apre una pull request. Se i dati sono ancora quelli dell'anno prima
# non succede niente: etl/ignora_data.py scarta la sola data di generazione in
# meta.json, che altrimenti cambierebbe a ogni giro e aprirebbe una pull request
# inutile. Nessuna pull request, nessun rumore.
#
# La pull request non si fonde da sola. La si guarda, si controlla che l'anno
# nel titolo sia quello giusto, e si fonde a mano.

name: Premi nuovi

on:
  schedule:
    # 06:00 UTC, ogni giorno, solo settembre e ottobre (costa un minuto e, senza
    # novita', non produce niente: cosi' i premi nuovi si prendono il giorno stesso)
    - cron: "0 6 * 9,10 *"
  workflow_dispatch:        # e quando si vuole, dal tasto "Run workflow"

permissions:
  contents: write
  pull-requests: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa openpyxl
        run: pip install --quiet openpyxl

      - name: Scarica i file dell'UFSP
        run: python3 etl/scarica.py

      - name: Ricostruisci i dati del sito
        run: python3 etl/costruisci.py

      - name: Verifica i dati contro il CSV federale
        run: python3 etl/verifica.py

      - name: Scarta la rigenerazione che cambia solo la data
        run: python3 etl/ignora_data.py

      - name: Leggi l'anno di premio e quello del registro
        id: anno
        run: |
          anno=$(python3 -c 'import json;print(json.load(open("sito/dati/meta.json"))["anno"])')
          registro=$(ls dati-fonte/zugelassene-krankenversicherer-*.xlsx | sed -E 's/.*krankenversicherer-([0-9]{4})-.*/\1/' | head -1)
          echo "anno=$anno" >> "$GITHUB_OUTPUT"
          echo "registro=$registro" >> "$GITHUB_OUTPUT"
          if [ "$anno" = "$registro" ]; then
            echo "registro_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "registro_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Premi $anno ma registro assicuratori $registro: la pull request sara' una bozza."
          fi

      - name: Apri la pull request, se qualcosa e' cambiato
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: sito/dati
          branch: premi-${{ steps.anno.outputs.anno }}
          commit-message: "Premi ${{ steps.anno.outputs.anno }}"
          title: "Premi ${{ steps.anno.outputs.anno }}"
          body: |
            Dati rigenerati da `etl/costruisci.py` a partire dai file dell'UFSP,
            e verificati da `etl/verifica.py` contro il CSV federale.

            Anno di premio: **${{ steps.anno.outputs.anno }}**
            Anno del registro assicuratori: **${{ steps.anno.outputs.registro }}**
            (se i due anni differiscono la pull request e' una bozza: l'UFSP
            non ha ancora pubblicato il registro nuovo, non fonderla)

            Da controllare prima di fondere:
            - l'anno qui sopra e' quello nuovo;
            - il registro degli assicuratori e' quello dell'anno nuovo (guardare
              il log del passo «Scarica i file dell'UFSP»);
            - la verifica e' passata (se non fosse passata questa pull request
              non esisterebbe: il lavoro si sarebbe fermato prima).
          draft: ${{ steps.anno.outputs.registro_ok != 'true' }}
          labels: dati
